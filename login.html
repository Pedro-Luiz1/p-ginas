<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carnegie Imóveis — Login</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }

  .page {
    --color-bg: #ffffff;
    --color-accent: #1a2370;
    --color-accent-hover: #14195c;
    --color-text: #17181c;
    --color-text-muted: #6b7280;
    --color-border: #d7d9dc;
    --color-input-bg: #ffffff;
    --color-error: #c62828;
    --radius-input: 8px;
    --radius-button: 8px;

    min-height: 100vh;
    display: flex;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--color-text);
  }

  /* ---------- Painel de marca (imagem) ---------- */

  .brandPanel {
    position: relative;
    flex: 1 1 42%;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }

  .brandImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(3px) saturate(0.7);
    transform: scale(1.03);
  }

  .brandOverlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      165deg,
      rgba(15, 20, 66, 0.92) 0%,
      rgba(26, 35, 112, 0.82) 45%,
      rgba(26, 35, 112, 0.55) 100%
    );
  }

  .brandContent {
    position: relative;
    z-index: 1;
    padding: 48px;
    color: #ffffff;
  }

  .brandLogo {
    height: 64px;
    width: auto;
    filter: brightness(0) invert(1) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.25));
    margin-bottom: 20px;
  }

  .brandTagline {
    font-size: 15px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.85);
    max-width: 320px;
    margin: 0;
  }

  /* ---------- Painel de formulário ---------- */

  .formPanel {
    flex: 1 1 58%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    padding: 24px;
  }

  .formInner {
    width: 100%;
    max-width: 360px;
  }

  .mobileLogo {
    display: none;
    height: 40px;
    width: auto;
    margin-bottom: 28px;
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--color-text-muted);
    margin: 0 0 32px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 18px;
  }

  .labelRow {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .label {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text);
  }

  .input {
    height: 44px;
    border-radius: var(--radius-input);
    border: 1px solid var(--color-border);
    background: var(--color-input-bg);
    color: var(--color-text);
    padding: 0 14px;
    font-size: 14px;
    width: 100%;
  }

  .input:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(26, 35, 112, 0.15);
  }

  .input[aria-invalid="true"] {
    border-color: var(--color-error);
  }

  .fieldError {
    font-size: 12px;
    color: var(--color-error);
    display: none;
  }

  .fieldError.visible {
    display: block;
  }

  .forgotLink {
    font-size: 12px;
    color: var(--color-accent);
    text-decoration: none;
  }

  .forgotLink:hover {
    text-decoration: underline;
  }

  .checkboxRow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--color-text);
    margin-bottom: 24px;
    accent-color: var(--color-accent);
  }

  .formError {
    font-size: 12px;
    color: var(--color-error);
    margin: 0 0 16px;
    display: none;
  }

  .formError.visible {
    display: block;
  }

  .button {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: var(--radius-button);
    background: var(--color-accent);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .button:hover:not(:disabled) {
    background: var(--color-accent-hover);
  }

  .button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .signupText {
    margin: 18px 0 0;
    font-size: 13px;
    color: var(--color-text-muted);
    text-align: center;
  }

  .signupLink {
    color: var(--color-accent);
    font-weight: 600;
    text-decoration: none;
  }

  .signupLink:hover {
    text-decoration: underline;
  }

  @media (max-width: 860px) {
    .brandPanel {
      display: none;
    }

    .formPanel {
      flex: 1 1 100%;
    }

    .mobileLogo {
      display: block;
    }
  }
</style>
</head>

        <h1 class="title">Bem-vindo de volta</h1>
        <p class="subtitle">Entre com sua conta para continuar</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label class="label" for="companyCode">Código da empresa</label>
            <input class="input" id="companyCode" name="companyCode" type="text" autocomplete="off" />
            <span class="fieldError" id="companyCode-error"></span>
          </div>

          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" />
            <span class="fieldError" id="email-error"></span>
          </div>

          <div class="field">
            <div class="labelRow">
              <label class="label" for="password">Senha</label>
              <a class="forgotLink" href="#">Esqueceu sua senha?</a>
            </div>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" />
            <span class="fieldError" id="password-error"></span>
          </div>

          <label class="checkboxRow">
            <input type="checkbox" id="remember" />
            <span>Lembrar de mim</span>
          </label>

          <p class="formError" id="form-error" role="alert"></p>

          <button class="button" type="submit" id="submitBtn">Entrar</button>

          <p class="signupText">Não tem uma conta? <a class="signupLink" href="#">Cadastrar-se</a></p>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Mesma lógica do componente React: sem backend ainda, então o submit
    // é mockado (simula um request e loga no console). Quando o backend
    // de auth existir, troca a função fakeLogin pela chamada real (fetch/etc).

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function fakeLogin(email, password) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (email && password) {
            resolve({ ok: true });
          } else {
            reject(new Error("Credenciais inválidas"));
          }
        }, 700);
      });
    }

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailError = document.getElementById("email-error");
    const passwordError = document.getElementById("password-error");
    const formError = document.getElementById("form-error");
    const submitBtn = document.getElementById("submitBtn");

    function setFieldError(input, errorEl, message) {
      if (message) {
        input.setAttribute("aria-invalid", "true");
        errorEl.textContent = message;
        errorEl.classList.add("visible");
      } else {
        input.removeAttribute("aria-invalid");
        errorEl.textContent = "";
        errorEl.classList.remove("visible");
      }
    }

    function validate() {
      let valid = true;

      if (!emailInput.value.trim()) {
        setFieldError(emailInput, emailError, "Informe o e-mail");
        valid = false;
      } else if (!isValidEmail(emailInput.value)) {
        setFieldError(emailInput, emailError, "E-mail inválido");
        valid = false;
      } else {
        setFieldError(emailInput, emailError, "");
      }

      if (!passwordInput.value) {
        setFieldError(passwordInput, passwordError, "Informe a senha");
        valid = false;
      } else {
        setFieldError(passwordInput, passwordError, "");
      }

      return valid;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      formError.textContent = "";
      formError.classList.remove("visible");

      if (!validate()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Entrando...";

      try {
        // TODO: trocar por chamada real ao backend quando ele existir
        await fakeLogin(emailInput.value, passwordInput.value);
        // TODO: redirecionar / setar sessão
        alert("Login OK (mock) — sem backend ainda, isso não autenticou de verdade.");
      } catch (err) {
        formError.textContent = "Não foi possível entrar. Confira email e senha.";
        formError.classList.add("visible");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
